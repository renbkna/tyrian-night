name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vscode-portability:
    name: VS Code static package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify:vscode-portable
      - run: bun run --cwd apps/vscode package:artifact

  repository-linux:
    name: Repository gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The fish startup test runs the generated snippet through a symlink.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends fish
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # This is the authoritative repository gate. It checks tracked generated
      # files before rebuilding anything, then runs every repository check and
      # the complete isolated test suite (including the Zed projection tests).
      - run: bun run verify
      - run: bun run --cwd apps/vscode bundle
      - run: bun run --cwd apps/vscode package:artifact
