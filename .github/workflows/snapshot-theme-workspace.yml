name: Publish verified Tyrian redesign

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tyrian-redesign-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'agent/rebuild-theme-state-system' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/rebuild-theme-state-system

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify and apply authored patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cat .github/tyrian-redesign-patch-text/part-*.patch > /tmp/tyrian-authored.patch
          sha256sum /tmp/tyrian-authored.patch | tee /tmp/tyrian-patch.sha256
          git apply --index --whitespace=error-all --verbose /tmp/tyrian-authored.patch 2>&1 | tee /tmp/tyrian-apply.log

      - name: Preserve publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tyrian-publication-diagnostics
          path: |
            /tmp/tyrian-patch.sha256
            /tmp/tyrian-apply.log
          retention-days: 1

      - name: Require applied patch
        if: steps.apply.outcome != 'success'
        run: exit 1

      - name: Remove publication inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .github/tyrian-redesign-patch-text \
            .github/tyrian-redesign-patch \
            .github/tyrian-redesign-xz \
            .github/redesign
          rm -f \
            .github/tyrian-publish-marker \
            .github/workflows/snapshot-theme-workspace.yml \
            .github/workflows/regenerate-redesign.yml
          git add -A
          git diff --cached --check

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate every consumer
        run: |
          bun run build:generated
          git add -A
          git diff --cached --check

      - name: Verify repository
        run: bun run verify

      - name: Commit final redesign
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/tyrian-redesign-patch-text
          test ! -e .github/tyrian-redesign-patch
          test ! -e .github/redesign
          test ! -e .github/workflows/snapshot-theme-workspace.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'rebuild theme palette and interaction system'
          git push origin HEAD:agent/rebuild-theme-state-system
