name: Finalize Tyrian redesign

on:
  push:
    branches:
      - agent/rebuild-theme-state-system
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-tyrian-redesign
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.head_ref == 'agent/rebuild-theme-state-system')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Restore the source projection
        shell: bash
        run: |
          cat .github/redesign/vscodeColors.xz.b64.part-* \
            | base64 --decode \
            | xz --decompress \
            > scripts/projections/vscodeColors.json
          rm -rf .github/redesign
          rm -f .github/workflows/regenerate-redesign.yml
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run build:generated
      - name: Preserve generated workspace
        uses: actions/upload-artifact@v4
        with:
          name: tyrian-redesign-workspace
          path: |
            .
            !.git/**
            !node_modules/**
            !apps/**/node_modules/**
            !dist/**
          include-hidden-files: true
          retention-days: 1
      - name: Check tracked generated assets
        run: bun run check:tracked-generated
      - name: Regenerate assets idempotently
        run: bun run build:generated
      - name: Type check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Check formatting
        run: bun run format:check
      - name: Check generated assets
        run: bun run check:generated
      - name: Check Union CSS
        run: bun run check:union-css
      - name: Check rice
        run: bun run check:rice
      - run: git diff --check
      - name: Commit verified generated assets
        shell: bash
        run: |
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "Expected generated redesign changes, but the index is empty." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate redesigned theme assets"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
