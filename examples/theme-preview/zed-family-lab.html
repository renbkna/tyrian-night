<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A compact Zed-style preview of the current Tyrian production family." />
    <title>Tyrian production family preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #08070b;
        color: #ddd8e3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 20% 0%, #302044, transparent 32rem), #08070b; }
      .page { width: min(1500px, calc(100% - 32px)); margin: auto; padding: 40px 0 72px; }
      header { max-width: 780px; margin-bottom: 30px; }
      .eyebrow { margin: 0 0 10px; color: #bd8de0; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 4.4rem); letter-spacing: -.055em; line-height: .98; }
      header p { margin: 0; color: #aaa3b1; line-height: 1.6; }
      .family { display: grid; gap: 24px; }
      .recipe { overflow: hidden; border: 1px solid color-mix(in srgb, var(--border), #fff 8%); border-radius: 16px; background: var(--canvas); box-shadow: 0 20px 70px #0008; }
      .recipe-heading { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; justify-content: space-between; padding: 18px 20px; background: var(--raised); border-bottom: 1px solid var(--border); }
      .recipe-heading h2 { margin: 0; color: var(--text); font-size: 1.1rem; }
      .recipe-heading p { margin: 0; color: var(--secondary); font-size: .78rem; }
      .scene { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, .8fr); }
      .editor, .terminal { min-width: 0; padding: 18px 20px; }
      .editor { border-right: 1px solid var(--border); }
      .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: .68rem; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--data); }
      .dot.rust { background: var(--warning); }
      pre { overflow: auto; margin: 0; color: var(--text); font: .76rem/1.65 "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      code span { color: var(--text); }
      .keyword { color: var(--keyword); } .function { color: var(--function); } .type { color: var(--type); }
      .data { color: var(--data); } .string { color: var(--string); } .regexp { color: var(--regexp); }
      .comment { color: var(--comment); } .punctuation { color: var(--punctuation); } .constant { color: var(--constant); }
      .diagnostic { text-decoration: underline wavy var(--error); text-decoration-thickness: 1px; }
      .terminal { background: color-mix(in srgb, var(--canvas) 78%, var(--field)); }
      .terminal pre { color: var(--secondary); }
      .prompt { color: var(--success); } .output { color: var(--info); } .warning { color: var(--warning); }
      .swatches { display: grid; grid-template-columns: repeat(8, 1fr); height: 9px; }
      .swatches i { background: var(--swatch); }
      @media (max-width: 760px) {
        .page { width: min(100% - 20px, 600px); padding-top: 24px; }
        .scene { grid-template-columns: 1fr; }
        .editor { border-right: 0; border-bottom: 1px solid var(--border); }
        .recipe-heading { padding: 14px 16px; }
        .editor, .terminal { padding: 15px 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">Current production family</p>
        <h1>Tyrian in a working editor.</h1>
        <p>Each card is rendered from the generated production projection. The fixed editor and terminal scene keeps the comparison consistent across every catalog recipe.</p>
      </header>
      <section id="family" class="family" aria-label="Current production family"></section>
    </main>
    <script src="./generated/production-family.js"></script>
    <script>
      const family = document.querySelector('#family');
      const source = window.TYRIAN_PRODUCTION_FAMILY;
      if (!Array.isArray(source)) {
        throw new Error('Generated Tyrian production family is missing.');
      }
      const code = (palette) => `
<span class="keyword">fn</span> <span class="function">render</span>&lt;<span class="type">Theme</span>&gt;(
  <span class="data">palette</span>: <span class="type">Theme</span>,
) -&gt; <span class="type">Result</span> {
  <span class="comment">// Keep the active state visible while editing.</span>
  <span class="keyword">let</span> <span class="data">accent</span> = <span class="string">"${palette.accent}"</span>;
  <span class="keyword">return</span> <span class="function">draw</span>(<span class="data">accent</span>, <span class="regexp">/current/</span>);
}`;
      for (const recipe of source) {
        const card = document.createElement('article');
        const p = recipe.palette;
        card.className = 'recipe';
        card.style.cssText = Object.entries(p).map(([key, value]) => `--${key}:${value}`).join(';');
        card.innerHTML = `
          <div class="recipe-heading"><h2>${recipe.name}</h2><p>${recipe.description}</p></div>
          <div class="scene">
            <div class="editor"><div class="bar"><i class="dot"></i>theme.rs <span>·</span> ${recipe.energy}</div><pre><code>${code(p)}</code></pre></div>
            <div class="terminal"><div class="bar"><i class="dot rust"></i>terminal</div><pre><span class="prompt">$</span> tyrian preview --theme ${recipe.id}
<span class="output">✓ editor palette loaded</span>
<span class="output">✓ semantic roles resolved</span>
<span class="warning">! selection and diagnostics visible</span>
<span class="prompt">$</span> _</pre></div>
          </div>
          <div class="swatches" aria-label="${recipe.name} palette"><i style="--swatch:var(--canvas)"></i><i style="--swatch:var(--accent)"></i><i style="--swatch:var(--keyword)"></i><i style="--swatch:var(--function)"></i><i style="--swatch:var(--type)"></i><i style="--swatch:var(--data)"></i><i style="--swatch:var(--string)"></i><i style="--swatch:var(--error)"></i></div>`;
        family.append(card);
      }
    </script>
  </body>
</html>
